[project]
name = "seed-agent"
version = "0.1.0"
description = "AI-first PT and downloader operations toolkit for a personal NAS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "rich>=13.7,<14.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
seed-agent = "seed_agent.cli:app"

[dependency-groups]
dev = [
  "pytest-asyncio>=0.23,<1.0",
  "pytest>=8.2,<9.0",
  "respx>=0.21,<1.0",
  "ruff>=0.5,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
