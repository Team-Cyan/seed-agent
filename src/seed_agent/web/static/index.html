<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seed Agent Settings</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">seed-agent</div>
        <nav class="nav-list" aria-label="Settings sections">
          <button class="nav-item active" type="button" data-section="tracker">Tracker</button>
          <button class="nav-item" type="button" data-section="downloader">下载器</button>
          <button class="nav-item" type="button" data-section="discovery">发现策略</button>
          <button class="nav-item" type="button" data-section="cleanup">清理策略</button>
          <button class="nav-item" type="button" data-section="intent">资源意图</button>
          <button class="nav-item" type="button" data-section="advanced">高级 YAML</button>
        </nav>
      </aside>

      <main class="content">
        <header class="page-header">
          <div>
            <h1>Tracker</h1>
            <p>新用户初始为空。点击添加后出现一个 Tracker 配置卡。</p>
          </div>
          <div class="header-actions">
            <div class="language-control">
              <button class="icon-button" type="button" aria-label="Language" data-language-button>
                ◎
              </button>
              <div class="language-menu" data-language-menu hidden>
                <button type="button" data-language-option="CN">CN</button>
                <button type="button" data-language-option="EN">EN</button>
              </div>
            </div>
            <button class="icon-button theme-button" type="button" aria-label="Toggle theme" data-theme-button>
              ☀
            </button>
            <button class="primary-button" type="button" data-add-tracker aria-label="Add Tracker">
              添加 Tracker
            </button>
          </div>
        </header>

        <section class="tracker-list" data-tracker-list aria-label="Trackers"></section>
      </main>
    </div>
    <div class="help-popover" data-help-popover hidden role="tooltip"></div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
