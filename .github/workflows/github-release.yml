name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read and validate release metadata
        id: release
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          test "v${version}" = "${tag}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY' > release-notes.md
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^## {re.escape(version)}(?:\s+-\s+.*)?$")
          start = next((idx for idx, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (idx for idx in range(start + 1, len(lines)) if lines[idx].startswith("## ")),
              len(lines),
          )
          body = "\n".join(lines[start + 1 : end]).strip()
          print(body or f"Release {version}.")
          PY

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
