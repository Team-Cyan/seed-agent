name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Check public repository hygiene
        run: python scripts/check_public_repository.py

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Dependency audit
        run: uv run --with pip-audit pip-audit --strict --local

      - name: Validate Compose example
        run: docker compose --env-file deploy/seed-agent.env.example -f deploy/docker-compose.example.yml config

      - name: Build Docker image
        run: docker build -t seed-agent:ci .

      - name: Docker smoke healthcheck with example config
        run: |
          state_dir="${RUNNER_TEMP}/seed-agent-state"
          mkdir -p "${state_dir}"
          docker run --rm \
            --entrypoint python \
            -v "${state_dir}:/app/.seed-agent" \
            seed-agent:ci \
            -c "from seed_agent.state import StateStore; StateStore('/app/.seed-agent/state.db')"
          docker run --rm \
            -v "${{ github.workspace }}/config:/app/config:ro" \
            -v "${state_dir}:/app/.seed-agent" \
            seed-agent:ci healthcheck --config /app/config/example.yaml
