name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Check public repository hygiene
        run: python scripts/check_public_repository.py

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Dependency audit
        run: uv run --with pip-audit pip-audit --strict --local

      - name: Validate Compose example
        run: docker compose --env-file deploy/seed-agent.env.example -f deploy/docker-compose.example.yml config

      - name: Build Docker image
        run: docker build --build-arg REVISION="${{ github.sha }}" -t seed-agent:ci .

      - name: Verify candidate image and descriptor hardlinks
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test "$(docker image inspect seed-agent:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_REVISION"
          test "$(docker image inspect seed-agent:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$(cat VERSION)"
          docker image inspect seed-agent:ci --format 'image={{.Id}} os={{.Os}} architecture={{.Architecture}}'
          docker run --rm -i --user 1000:100 --entrypoint python seed-agent:ci - <<'PYTHON'
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path
          from seed_agent import __version__
          from seed_agent.media_import import filesystem as fs

          assert sys.platform == "linux"
          assert (os.geteuid(), os.getegid()) == (1000, 100)
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              source_root, target_root = root / "source", root / "target"
              source_root.mkdir()
              target_root.mkdir()
              source = source_root / "approved.mkv"
              source.write_bytes(b"approved inode")
              expected = fs.receipt(source_root, source)
              target = target_root / "published.mkv"
              original_link = os.link
              def replace_name_before_link(src, dst, **kwargs):
                  assert str(src).startswith("/proc/self/fd/")
                  source.rename(source_root / "retained.mkv")
                  source.write_bytes(b"replacement inode")
                  original_link(src, dst, **kwargs)
              os.link = replace_name_before_link
              try:
                  fs.link(source_root, source, target_root, target,
                          source_identity=fs.identity(source_root),
                          target_identity=fs.identity(target_root), expected=expected)
              finally:
                  os.link = original_link
              assert fs.receipt(target_root, target) == expected
              assert target.samefile(source_root / "retained.mkv")
              assert not target.samefile(source)
          print(json.dumps({"version": __version__, "uid": os.geteuid(),
                            "gid": os.getegid(), "descriptor_link_verified": True}))
          PYTHON

      - name: Docker smoke healthcheck with example config
        run: |
          state_dir="${RUNNER_TEMP}/seed-agent-state"
          mkdir -p "${state_dir}"
          docker run --rm \
            --entrypoint python \
            -v "${state_dir}:/app/.seed-agent" \
            seed-agent:ci \
            -c "from pathlib import Path; from seed_agent.state import StateStore; StateStore(Path('/app/.seed-agent/state.db'))"
          docker run --rm \
            -v "${{ github.workspace }}/config:/app/config:ro" \
            -v "${state_dir}:/app/.seed-agent" \
            seed-agent:ci healthcheck --config /app/config/example.yaml
