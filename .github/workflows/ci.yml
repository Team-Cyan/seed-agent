name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Validate Compose example
        run: docker compose --env-file deploy/seed-agent.env.example -f deploy/docker-compose.example.yml config

      - name: Build Docker image
        run: docker build -t seed-agent:ci .

      - name: Docker smoke healthcheck with example config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/config:/app/config:ro" \
            seed-agent:ci healthcheck --config /app/config/example.yaml
