name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: >-
    docker-publish-${{ (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Resolve tested revision
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          revision="${GITHUB_SHA}"
          publish=true
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            revision="${WORKFLOW_RUN_SHA}"
            current_main_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
            )"
            if [[ "${revision}" != "${current_main_sha}" ]]; then
              echo "Skipping stale CI revision ${revision}; main is ${current_main_sha}."
              publish=false
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            successful_ci_runs="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f head_sha="${revision}" \
                -f event=push \
                -f status=completed \
                -f per_page=20 \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
            )"
            if [[ "${successful_ci_runs}" == "0" ]]; then
              echo "Skipping main revision ${revision}; no successful CI push run exists."
              publish=false
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: >-
      needs.gate.outputs.publish == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.gate.outputs.revision }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Read release metadata
        id: release
        shell: bash
        env:
          REVISION: ${{ needs.gate.outputs.revision }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${REVISION:0:7}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            test "v${version}" = "${GITHUB_REF_NAME}"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/team-cyan/seed-agent
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_run' && github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=seed-agent
            org.opencontainers.image.description=Docker-first PT automation for NAS and homelab downloader operations
            org.opencontainers.image.icon=https://raw.githubusercontent.com/Team-Cyan/seed-agent/main/docs/assets/icon.png
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.revision }}
            BUILD_DATE=${{ steps.release.outputs.created }}
