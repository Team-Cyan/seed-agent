services:
  seed-agent:
    image: ${SEED_AGENT_IMAGE:-ghcr.io/team-cyan/seed-agent:latest}
    # For local source deployments, uncomment:
    # build:
    #   context: ..
    container_name: seed-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    labels:
      org.opencontainers.image.icon: https://raw.githubusercontent.com/Team-Cyan/seed-agent/main/docs/assets/seed-agent-icon-transparent.png
    environment:
      SEED_AGENT_MODE: schedule-run
      SEED_AGENT_CONFIG: /app/config/config.yaml
      SEED_AGENT_EXECUTE: "true"
      SEED_AGENT_INTERVAL_MINUTES: "60"
      SEED_AGENT_MIN_FREE_WINDOW_MINUTES: "180"
      SEED_AGENT_REQUIRE_KNOWN_FREE_WINDOW: "true"
      SEED_AGENT_HEARTBEAT_FILE: /state/schedule-heartbeat.json
      SEED_AGENT_MAX_STALENESS_MINUTES: "90"
      SEED_AGENT_PRUNE: "true"
      SEED_AGENT_INTENT_EXECUTE: "false"
      SEED_AGENT_STARTUP_STATUS: "true"
      SEED_AGENT_WEB_ENABLED: "true"
      SEED_AGENT_WEB_HOST: 0.0.0.0
      SEED_AGENT_WEB_PORT: "8765"
      SEED_AGENT_WEB_TOKEN: ${SEED_AGENT_WEB_TOKEN:-}
      SEED_AGENT_MTEAM_MIN_REQUEST_INTERVAL_SECONDS: ${SEED_AGENT_MTEAM_MIN_REQUEST_INTERVAL_SECONDS:-1}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-100}
    ports:
      - "8765:8765"
    volumes:
      - ../config:/app/config:ro
      - ../local:/app/local:ro
      - ../.seed-agent:/app/.seed-agent
      - ../state:/state
    healthcheck:
      test:
        [
          "CMD",
          "/app/docker/entrypoint.sh",
          "seed-agent",
          "healthcheck",
          "--config",
          "/app/config/config.yaml",
          "--heartbeat-file",
          "/state/schedule-heartbeat.json",
          "--max-staleness-minutes",
          "90"
        ]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 4m
