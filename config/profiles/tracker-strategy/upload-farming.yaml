# Upload-farming tracker strategy example.
# Copy selected blocks into your real config; this is not a standalone config.

tracker_sites:
  - name: mteam
    type: mteam
    discovery_mode: api
    api_discovery:
      modes: [normal, adult]
      only_free: true
      sort_field: leechers
      sort_order: desc
      page_size: 100
      max_pages: 8
      min_seeders: 1
      max_seeders: 0
      min_leechers: 0

pt_filters:
  discounts: [free, 2xfree]
  min_left_time_minutes: 120
  min_seeders: 1
  min_leechers: 30
  leecher_score_full_at_multiplier: 3.0
  target_seed_leecher_ratio: 2
  max_seed_leecher_ratio: 10
  freshness_full_score_hours: 6
  freshness_zero_score_hours: 48
  min_size_gb: 0
  max_size_gb: 0
  preferred_size_min_gb: 2
  preferred_size_max_gb: 300
  size_partial_max_gb: 1000
  max_active_downloads: 8
  max_total_amount_left_gb: 1000
  min_free_disk_gb: 0
  allow_non_free: false
  allow_hr: false

pt_scoring:
  min_score_to_enqueue: 80
  weights:
    discount: 20
    leechers: 30
    seeders: 25
    freshness: 15
    left_time: 5
    size: 3
    site_history: 2
