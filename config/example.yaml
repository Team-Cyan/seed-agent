mode: balanced
sites:
  - name: demo
    type: nexusphp
    enabled: true
    rss_url: https://tracker.example/rss.php?passkey=secret
    cookie_ref: local/secrets/demo.cookie
  # Example M-Team shape:
  # - name: mt
  #   type: mteam
  #   enabled: false
  #   rss_url: https://rss.m-team.cc/api/rss/fetch?dl=1&pageSize=10&sign=secret
  #   # Secret reference only. The token value itself stays in local/secrets/mt.api-key.
  #   api_key_ref: local/secrets/mt.api-key
  #   discovery_mode: api
  #   # Versioned strategy config. Keep this block in config, not in secrets.
  #   api_discovery:
  #     mode: adult
  #     page_number: 1
  #     only_free: true
  #     # Optional OpenAPI discount enum. When omitted, only_free=true sends FREE.
  #     # discount: _2X_FREE
  #     sort_field: downloads
  #     sort_order: desc
  #     page_size: 50
  #     # Optional native M-Team filters. IDs come from M-Team list endpoints such as
  #     # categoryList, sourceList, mediumList, standardList, and codec/team lists.
  #     # categories: [410, 429]
  #     # standards: [1, 6]
  #     # video_codecs: [1, 16]
  #     # sources: [8]
  #     # mediums: [10]
  #     # teams: [9]
  #     # labels_new: []
  #     # hot: true
  #     min_seeders: 0
  #     max_seeders: 200
  #     min_leechers: 0
  #     min_times_completed: 0
  #   # Optional compatibility fallback: a logged-in M-Team site cookie.
  #   cookie_ref: local/secrets/mt.cookie
discovery:
  discounts: [free, 2xfree]
  min_left_time_minutes: 120
  min_leechers: 8
  max_seeders: 80
  allow_hr: false
scoring:
  min_score_to_enqueue: 70
  weights:
    discount: 30
    leechers: 25
    seeders: 15
    left_time: 15
    size: 10
    site_history: 5
downloader:
  type: qbittorrent
  target: unraid-qb
  default_category: seed
  category_policies:
    - name: seed
      mode: mutable
      budget_pool: downloads
      delete_enabled: true
      over_budget_behavior: add_paused
      tags: [seed-agent, seed]
    - name: movie
      mode: add_only
      budget_pool: media
      delete_enabled: false
      over_budget_behavior: add_paused
      tags: [seed-agent, movie]
    - name: tv
      mode: add_only
      budget_pool: media
      delete_enabled: false
      over_budget_behavior: add_paused
      tags: [seed-agent, tv]
  budget_pools:
    - name: downloads
      max_size_tib: 10
    - name: media
      max_size_tib: 10
  secret_ref: local/secrets/qbittorrent.yaml
cleanup:
  cold_after_days: 7
  min_upload_delta_gb: 1
  protect_hr: true
  protect_manual: true
  protect_media_library: true
  pause_before_delete_hours: 24
intent:
  confirmation_threshold: 0.82
  auto_enqueue_threshold: 0.94
  ambiguity_gap: 0.08
  default_resolution: 1080p
  preferred_languages: [zh, en]
  inbox_ref: local/inbox/intents.jsonl
search:
  site_priority:
    demo: 10
  max_results_per_site: 20
  prefer_free: true
  reject_hr_by_default: true
sources:
  telegram:
    enabled: false
    secret_ref: local/secrets/telegram.yaml
  wechat_bridge:
    enabled: false
    secret_ref: local/secrets/wechat-bridge.yaml
  douban_wanted:
    enabled: false
    export_ref: local/inbox/douban-wanted.json
  subscription:
    enabled: false
    rules_ref: config/subscriptions.yaml
