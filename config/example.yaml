mode: balanced
tracker_sites:
  - name: demo
    type: nexusphp
    enabled: true
    rss_url: https://tracker.example/rss.php?passkey=YOUR_PASSKEY
    cookie_ref: local/secrets/demo.cookie
  # Example M-Team shape:
  # - name: mteam
  #   type: mteam
  #   enabled: false
  #   rss_url: https://rss.m-team.cc/api/rss/fetch?dl=1&pageSize=10&sign=YOUR_RSS_SIGN
  #   # Secret reference only. The token value itself stays in local/secrets/mt.api-key.
  #   api_key_ref: local/secrets/mt.api-key
  #   auth_header: x-api-key
  #   discovery_mode: api
  #   # Versioned strategy config. Keep this block in config, not in secrets.
  #   api_discovery:
  #     mode: adult
  #     # Optional multi-mode discovery. When set, each mode is queried with
  #     # the same filters and results are deduplicated before scoring.
  #     modes: [normal, adult]
  #     page_number: 1
  #     only_free: true
  #     # Optional OpenAPI discount enum. When omitted, only_free=true sends FREE.
  #     # discount: _2X_FREE
  #     sort_field: downloads
  #     sort_order: desc
  #     page_size: 50
  #     # Fetch more pages when the first page is mostly already-managed torrents.
  #     max_pages: 1
  #     # Optional native M-Team filters. IDs come from M-Team list endpoints such as
  #     # categoryList, sourceList, mediumList, standardList, and codec/team lists.
  #     # categories: [410, 429]
  #     # standards: [1, 6]
  #     # video_codecs: [1, 16]
  #     # sources: [8]
  #     # mediums: [10]
  #     # teams: [9]
  #     # labels_new: []
  #     # hot: true
  #     # null inherits pt_filters.min_seeders for upload discovery. Use 0 to
  #     # intentionally disable the native lower-bound filter at the M-Team API layer.
  #     min_seeders: null
  #     # 0 or null means no native API seeder upper-bound filter.
  #     max_seeders: 0
  #     # null inherits pt_filters.min_leechers for upload discovery. Use 0 for
  #     # broad search followed by local scoring.
  #     min_leechers: null
  #     min_times_completed: 0
  #   # Optional compatibility fallback: a logged-in M-Team site cookie.
  #   cookie_ref: local/secrets/mt.cookie
pt_filters:
  discounts: [free, 2xfree]
  min_left_time_minutes: 120
  min_seeders: 1
  min_leechers: 8
  # Set above 1.0 to make leecher score ramp up from min_leechers to
  # min_leechers * multiplier instead of granting full credit at the minimum.
  # This is useful for upload-farming configurations that should favor
  # stronger live demand without adding a strategy_profile switch.
  leecher_score_full_at_multiplier: 1.0
  # Soft scoring pressure: seeders / max(leechers, 1). Higher ratios lose
  # seeder-score credit but are not hard-rejected.
  target_seed_leecher_ratio: 10
  # Hard competition ceiling. High absolute seeder counts remain eligible when
  # demand is proportionally high; only the seeders/leechers ratio is bounded.
  # Set to 0 or null to disable.
  max_seed_leecher_ratio: 10
  # Fresh candidates receive full freshness credit, then taper to zero.
  freshness_full_score_hours: 6
  freshness_zero_score_hours: 72
  # discounts is a strict allowlist unless this is true. Set true only when
  # NORMAL and partial-discount candidates are intentionally eligible.
  allow_non_free: false
  # Hard candidate size bounds. Use these to keep giant packs out of mutable seed pools.
  # Set max_size_gb to 0 or null to disable the hard size ceiling.
  max_size_gb: 150
  # Soft scoring preference range. Candidates outside this range lose size points
  # but are not rejected unless they violate min_size_gb/max_size_gb.
  preferred_size_min_gb: 2
  preferred_size_max_gb: 80
  # Upper bound for partial size credit after preferred_size_max_gb. Raise this
  # for upload-farming profiles that intentionally allow very large hot packs,
  # or lower it for space-saving profiles.
  size_partial_max_gb: 150
  # Optional conservative runtime gates. max_active_downloads applies only to
  # the default seed category; media acquisition does not consume seed slots.
  # When reached, seed enqueue is rejected before the downloader is called.
  # Set either upper limit to 0 or null to disable it.
  # max_active_downloads: 3
  # max_total_amount_left_gb: 150
  # min_free_disk_gb keeps this much downloader-reported free disk space
  # unreserved after existing incomplete downloads. Useful when qB and media
  # categories share the same physical volume.
  # min_free_disk_gb: 500
  allow_hr: false
pt_scoring:
  min_score_to_enqueue: 70
  weights:
    discount: 30
    leechers: 25
    seeders: 15
    freshness: 0
    left_time: 15
    size: 10
    site_history: 5
download_client:
  type: qbittorrent
  target: unraid-qb
  default_category: seed
  # Optional Want List routing. Values must reference names in category_policies.
  # Empty or omitted values keep the legacy fallback:
  # movie -> movie when present, tv/anime -> tv when present, otherwise default_category.
  media_category_map:
    movie: movie
    tv: tv
    anime: tv
  category_policies:
    - name: seed
      mode: mutable
      budget_pool: downloads
      delete_enabled: true
      over_budget_behavior: reject
      tags: [seed-agent, seed]
    - name: movie
      mode: add_only
      budget_pool: media
      delete_enabled: false
      over_budget_behavior: reject
      tags: [seed-agent, movie]
    - name: tv
      mode: add_only
      budget_pool: media
      delete_enabled: false
      over_budget_behavior: reject
      tags: [seed-agent, tv]
  budget_pools:
    # Example-only values. Set real pool limits in local runtime YAML/Web UI.
    - name: downloads
      max_size_tib: 10
    - name: media
      max_size_tib: 10
  secret_ref: local/secrets/qbittorrent.yaml
seed_cleanup:
  cold_after_days: 7
  min_upload_delta_gb: 1
  protect_hr: true
  protect_manual: true
  protect_media_library: true
  delete_after_no_upload_hours: 2
  # Capacity-driven deletes stop at this count per scheduler run. Direct
  # incomplete paid/free-window risk deletes remain independent.
  max_capacity_deletes_per_run: 50
want_decision:
  confirmation_threshold: 0.82
  auto_enqueue_threshold: 0.94
  ambiguity_gap: 0.08
  default_resolution: null
  # For TV/anime episode intents, "season" searches and ranks full-season packs;
  # use "episode" when the operator prefers one episode at a time.
  series_search_mode: season
  preferred_languages: [zh, en]
  inbox_ref: local/inbox/intents.jsonl
release_preferences:
  site_priority:
    demo: 10
  max_results_per_site: 20
  # Bound M-Team identifier/fallback calls for each Want List item.
  max_api_requests_per_intent: 3
  prefer_free: true
  reject_hr_by_default: true
  # Intent search quality preferences. Values are integer score adjustments
  # for canonical tag groups; aliases in the same group count once.
  quality_tag_scores:
    webdl: 8
    remux: 0
    bluray: -15
    uhd_bluray: -10
    dolby_vision: 12
    hdr10: 5
    hdr10_plus: -5
    2160p: 8
    1080p: -12
    ddp: 8
    atmos: 5
    truehd: -12
    dts_hd_ma: -12
scheduler:
  interval_minutes: 60
  # qB-only hard-cap and broken-download check between full tracker cycles.
  capacity_guard_interval_seconds: 60
  min_free_window_minutes: 180
  require_known_free_window: true
  prune_enabled: true
  tracker_backfill_enabled: true
  tracker_backfill_category: null
  intent_enabled: true
  intent_execute: false
  intent_search_mode: daily
  intent_search_hour: 0
  # Prevent two scheduler processes from mutating the same runtime. The lease
  # is renewed every cycle and can be taken over after expiry.
  lease_ttl_minutes: 120
metrics:
  # Disabled by default. Metrics are derived from local SQLite/heartbeat state
  # and never call a tracker or downloader during scrape.
  enabled: false
  path: /metrics
local_state:
  candidate_retention_days: 30
  backup_retention_count: 10
  audit_archive_retention_count: 20
  audit_archive_max_mb: 100
want_sources:
  telegram:
    enabled: false
    secret_ref: local/secrets/telegram.yaml
  wechat_bridge:
    enabled: false
    secret_ref: local/secrets/wechat-bridge.yaml
  douban_wanted:
    enabled: false
    # Douban user name or profile URL, for example example-user or
    # https://www.douban.com/people/example-user
    user_name: null
    # Legacy compatibility field; the personal-interest RSS has no pagination.
    # Optional local export fallback. Keep private exports under local/inbox.
    export_ref: local/inbox/douban-wanted.json
  # Canonical Want List sources shown by the Web UI and synced by intent runs.
  # Configure multiple Douban users or IMDb watchlists/lists here; repeated
  # works are merged by Douban/IMDb IDs and only the earliest want is searched.
  want_lists:
    - provider: douban
      id: douban-me
      label: Example Douban list
      enabled: false
      user_name: example-user
      # Legacy compatibility field; the personal-interest RSS has no pagination.
      # Optional local export fallback. Keep private exports under local/inbox.
      # export_ref: local/inbox/douban-me.json
    - provider: imdb
      id: imdb-weekend
      label: Example IMDb list
      enabled: false
      watchlist_url: https://www.imdb.com/user/p.example/watchlist/
      # IMDb public pages may challenge server-side fetches. CSV export refs are
      # the stable fallback when public HTML is not reachable.
      export_ref: local/inbox/imdb-weekend.csv
  subscription:
    enabled: false
    rules_ref: config/subscriptions.yaml
